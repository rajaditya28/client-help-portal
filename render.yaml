# Render Blueprint: one free web service running the API, the worker and the built Vue app.
# Database: Neon (free Postgres). Recordings: Cloudflare R2 (S3-compatible).
services:
  - type: web
    name: client-help-portal
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: cd apps/api && npx prisma migrate deploy && node prisma/seed.js && node dist/main.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ICE_SERVERS
        value: '[{"urls":"stun:stun.l.google.com:19302"}]'
