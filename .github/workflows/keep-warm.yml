# Render's free tier sleeps after 15 idle minutes (first request then takes ~1 min).
# Pinging the health endpoint keeps the demo responsive for reviewers.
# Set the repository variable APP_URL (Settings -> Secrets and variables -> Actions -> Variables).
name: keep-warm
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    if: ${{ vars.APP_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 90 "${{ vars.APP_URL }}/api/health"
